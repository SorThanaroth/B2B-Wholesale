spring.application.name=marketplace
spring.threads.virtual.enabled=true

# HTTP port (override with SERVER_PORT if 8080 is taken)
server.port=${SERVER_PORT:8082}

# ----- Datasource (override via env for prod) -----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5544/b2b_wholesale}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ----- Redis -----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ----- JWT -----
jwt.secret=${JWT_SECRET:9i9PPBBdN7OKQDpY2C4HEECQLZ0QrnLEwx8gJvk81P4TX1SBA39IJwMMfvTW6S6Q}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.verification-expiration=86400000

# ----- File upload (CSV import / images) -----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ----- Actuator (health/info are public; see SecurityConfig) -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ----- Demo data seeding (admin + sample catalog when DB is empty) -----
app.seed.enabled=true
