databases:
  - name: marketplace-db
    databaseName: b2b_wholesale
    user: b2b_wholesale_user
    plan: free
    region: singapore

services:
  - type: web
    name: marketplace-api
    runtime: docker
    plan: free
    region: singapore        # MUST match the database region
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # --- Postgres (composed into spring.datasource.url by the app) ---
      - key: DB_HOST
        fromDatabase: { name: marketplace-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: marketplace-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: marketplace-db, property: database }
      - key: DB_USER
        fromDatabase: { name: marketplace-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: marketplace-db, property: password }
      # --- JWT secret (auto-generated; any value is accepted via the SHA-256 fallback) ---
      - key: JWT_SECRET
        generateValue: true
      # --- CORS: set to your deployed frontend origin (comma-separate multiples) ---
      #     e.g. https://marketplace-web.onrender.com
      - key: APP_CORS_ORIGINS
        sync: false

# Redis is intentionally omitted — it isn't used by the app, and its health
# indicator is disabled (management.health.redis.enabled=false). Add a
# `type: redis` service + REDIS_HOST/REDIS_PORT later only if you introduce caching.
