services:
  - type: web
    name: marketplace-api
    runtime: docker
    plan: free
    envVars:
      # Database — hardcoded JDBC URL from your Render PostgreSQL
      - key: DB_URL
        value: "jdbc:postgresql://dpg-d8a2uc8jo6nc73ebmk20-a/b2b_wholesale"
      - key: DB_USER
        value: "b2b_wholesale_user"
      - key: DB_PASSWORD
        value: "rXGesNlCym90k95zn8271W8wpkxqz8YE"

      # Port — Render scans for this
      - key: SERVER_PORT
        value: "8082"

      # Redis
      - key: REDIS_HOST
        fromService:
          name: marketplace-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: marketplace-redis
          type: redis
          property: port

      # JWT
      - key: JWT_SECRET
        generateValue: true

  - type: redis
    name: marketplace-redis
    plan: free
    ipAllowList: []

databases:
  - name: marketplace-db
    plan: free
    databaseName: b2b_wholesale